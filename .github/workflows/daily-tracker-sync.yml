name: Daily Validation Tracker Sync

on:
  schedule:
    # Runs twice daily: 09:00 AM IST (03:30 UTC) and 07:00 PM IST (13:30 UTC)
    - cron: '30 3,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab or Power Automate
  repository_dispatch: # Allows Power Automate webhooks to trigger via GitHub API
    types: [tracker-sync, excel-updated]
  push:
    paths:
      - 'scratch/tracker.xlsx'
    branches:
      - main
      - Dev-testing

permissions:
  contents: write

jobs:
  sync:
    # Prevent infinite loop when action commits changes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync tracker from SharePoint
        run: npm run sync-tracker
        env:
          TRACKER_EXCEL_URL: ${{ secrets.TRACKER_EXCEL_URL }}

      - name: Commit and push changes
        env:
          # Everything the sync generates. leaderboard-history.json must be
          # committed so the next sync can show rank changes between versions.
          SYNC_FILES: >-
            src/components/modelBenchmarkData.ts
            src/components/leaderboardData.ts
            src/components/valsIndexData.ts
            src/components/reportsFeedData.ts
            scripts/leaderboard-history.json
            scratch/tracker.xlsx
        run: |
          if [ -n "$(git status --porcelain $SYNC_FILES)" ]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $SYNC_FILES
            git commit -m "chore: auto-sync validation tracker metrics from SharePoint [skip ci]"
            git push
            echo "Changes pushed successfully."
          else
            echo "No changes found in validation tracker."
          fi
